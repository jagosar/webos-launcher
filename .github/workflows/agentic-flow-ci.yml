# The flow's own tests: guardrails, pipeline commands, workflow logic (simulated agents), agent definitions
# and documentation drift. It only runs in the template repo, not in projects created from it.
#
# Hardened: actions pinned by SHA (the tag goes in the comment), minimal permissions, no credentials
# persisted in the checkout, nothing third-party installed, bounded concurrency and timeout.
name: agentic-flow-ci
on:
  push:
    paths: [".claude/**", ".claude-plugin/**", "plugin/**", "docs/**", "*.md", ".github/workflows/agentic-flow-ci.yml"]
  pull_request:
    paths: [".claude/**", ".claude-plugin/**", "plugin/**", "docs/**", "*.md", ".github/workflows/agentic-flow-ci.yml"]

permissions:
  contents: read

concurrency:
  group: agentic-flow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.repository == 'jagosar/agentic-flow'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: git config --global init.defaultBranch main
      - name: Workflow scenarios (simulated agents)
        run: node .claude/bin/test_workflow.mjs
      - name: Guardrails, commands and definitions
        run: python -m unittest discover -s .claude/bin -p "test_*.py" -v

  plugin:
    if: github.repository == 'jagosar/agentic-flow'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # Exact version and no install scripts: the native binary ships in its own package and is used as it is.
      - name: Claude Code (only to validate the plugin, no credentials)
        run: npm install --prefix "$RUNNER_TEMP/cc" --no-save --ignore-scripts --no-audit --no-fund @anthropic-ai/claude-code@2.1.302
      - name: Validate plugin and marketplace
        run: '"$RUNNER_TEMP/cc/node_modules/@anthropic-ai/claude-code-linux-x64/claude" plugin validate --strict .'
