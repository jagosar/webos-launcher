# The flow's own tests: guardrails, pipeline commands, workflow logic (simulated agents), agent definitions
# and documentation drift. It only runs in the template repo, not in projects created from it.
#
# Hardened: actions pinned by SHA (the tag goes in the comment), minimal permissions, no credentials
# persisted in the checkout, nothing third-party installed, bounded concurrency and timeout.
name: agentic-flow-ci
on:
  # Pushes to other branches are covered by their pull request: running both doubled the jobs (and the scarce macOS
  # runners) for every change.
  push:
    branches: [main]
    paths: [".claude/**", ".claude-plugin/**", "plugin/**", "docs/**", "*.md", ".github/workflows/agentic-flow-ci.yml", "bench/**", ".github/workflows/agentic-bench.yml", ".github/workflows/agentic-flow-release.yml"]
  pull_request:
    paths: [".claude/**", ".claude-plugin/**", "plugin/**", "docs/**", "*.md", ".github/workflows/agentic-flow-ci.yml", "bench/**", ".github/workflows/agentic-bench.yml", ".github/workflows/agentic-flow-release.yml"]
  # The full matrix on demand, for a pull request that touches platform code (Actions tab, "Run workflow").
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agentic-flow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.repository == 'jagosar/agentic-flow'
    runs-on: ${{ matrix.os }}
    # Windows is slower at starting processes and running git, and this suite is mostly subprocesses.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 45 || 15 }}
    strategy:
      fail-fast: false
      # The repository is public, so GitHub-hosted runners cost nothing: every pull request runs the full matrix.
      # (While it was private, a Windows minute counted double and a macOS minute ten times, and the full matrix on
      # every push used 1,860 of the 2,000 included minutes in one day: pull requests then ran Linux only.)
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.12", "3.14"]
        include:
          - {os: windows-latest, python: "3.12"}
        # macOS is not in the matrix: nobody here uses it, and its scarce runners queued past the job's time limit.
    defaults:
      run:
        shell: bash  # Git Bash on Windows, as Claude Code uses there
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: git config --global init.defaultBranch main
      - name: Workflow scenarios (simulated agents)
        run: node .claude/bin/test_workflow.mjs
      - name: Guardrails, commands and definitions
        run: |
          set -o pipefail
          python -m unittest discover -s .claude/bin -p "test_*.py" -v 2>&1 | tee "$RUNNER_TEMP/unittest.txt"
          # The other suites exist in agentic-flow itself; install copies this workflow into template copies that
          # may not have them, so a missing folder is skipped instead of failing the job.
          suite() { [ -d "$1" ] || { echo "skipped: no $1/"; return 0; }; shift; "$@" 2>&1 | tee -a "$RUNNER_TEMP/unittest.txt"; }
          suite bench python -m unittest discover -s bench -p "test_*.py" -v
          suite bench/acceptance python -m unittest discover -s bench/acceptance -v
          suite acceptance python -m unittest discover -s acceptance -v
          suite qa python -m unittest discover -s qa -v
      # The clean-code ratchet: nothing may get worse than .claude/quality-baseline.json (skipped without one).
      - name: Clean-code ratchet
        run: python .claude/bin/agentic.py quality
      # The failures as one annotation, readable on the pull request and through the API without the full log.
      - name: Failures as an annotation
        if: failure()
        run: |
          detail=$(tr -d '\r' < "$RUNNER_TEMP/unittest.txt" | sed -n '/^=\{20,\}$/,/^Ran /p' | head -c 3500)
          detail=${detail//'%'/'%25'}
          echo "::error title=unittest failures::${detail//$'\n'/'%0A'}"

  # The flow as a project receives it: installed into an empty repository, where the shipped tests must pass
  # too. A test that only holds in this repository (its README, its skills, its own scripts) is caught here.
  installed:
    if: github.repository == 'jagosar/agentic-flow'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: git config --global init.defaultBranch main
      - name: Install into an empty project and run the shipped tests there
        run: |
          project="$RUNNER_TEMP/project"
          mkdir -p "$project" && cd "$project" && git init -q
          printf 'def main():\n    return 1\n' > main.py
          # The shape of a project made from the template: the plugin files, this workflow and the flow's test
          # suite (install ships the whole suite wherever any part is present), but not the README marker and not
          # the per-release acceptance tests, which check this repository's own docs.
          printf '# Project\n' > README.md
          mkdir -p .claude/bin .claude-plugin plugin/commands .github/workflows
          cp "$GITHUB_WORKSPACE/.claude/bin/testutil.py" .claude/bin/
          cp "$GITHUB_WORKSPACE"/.claude-plugin/*.json .claude-plugin/
          cp "$GITHUB_WORKSPACE"/plugin/commands/*.md plugin/commands/
          cp "$GITHUB_WORKSPACE/.github/workflows/agentic-flow-ci.yml" .github/workflows/
          git add -A && git -c user.name=ci -c user.email=ci@example.com commit -qm init
          python "$GITHUB_WORKSPACE/.claude/bin/agentic.py" install .
          test -f .claude/bin/test_agentic.py || { echo "install shipped no tests"; exit 1; }
          python .claude/bin/agentic.py quality
          python -m unittest discover -s .claude/bin -p "test_*.py"
          node .claude/bin/test_workflow.mjs

  # The flow history must recognise every published version, and the pending one while plugin.json carries an
  # untagged version (a release pull request regenerates it as its last commit). It needs the whole history and the
  # tags, so it runs once on a full clone instead of in the shallow matrix.
  history:
    if: github.repository == 'jagosar/agentic-flow'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Flow history covers every published version
        run: python .claude/bin/agentic.py flow-history --check

  plugin:
    if: github.repository == 'jagosar/agentic-flow'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # Exact version and no install scripts: the native binary ships in its own package and is used as it is.
      - name: Claude Code (only to validate the plugin, no credentials)
        run: npm install --prefix "$RUNNER_TEMP/cc" --no-save --ignore-scripts --no-audit --no-fund @anthropic-ai/claude-code@2.1.302
      - name: Validate plugin and marketplace
        run: '"$RUNNER_TEMP/cc/node_modules/@anthropic-ai/claude-code-linux-x64/claude" plugin validate --strict .'
